[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xfr-engine"
version = "0.4.1"
description = "XFR-AI deterministic financial engine: cash/debt identities, minimum-equity LP, credit-to-equity substitution index (CES/ISC) and the directional shadow price of credit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mario de Alencar Netto" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
etapa2 = ["pandas>=2.0", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/mariodealencar1006-cloud/xfr-engine"

[tool.setuptools]
packages = ["xfr_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
