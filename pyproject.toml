[project]
name = "xfr-engine"
version = "0.2.0"
description = "XFR-AI deterministic financial engine: cash/debt identities, minimum-equity LP, credit-to-equity substitution index (CES/ISC) and the directional shadow price of credit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[tool.setuptools]
packages = ["xfr_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
